<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Collect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>Collect</h1>
  <p>Collecter les bonnes informations mène à la réussite</p>
  <select id="languageSwitcher">
    <option value="fr">FR</option>
    <option value="en">EN</option>
  </select>
  <div class="progress"><div id="progressBar"></div></div>
</header>

<main>
<form id="collectForm" action="https://formspree.io/f/2933297241487572058" method="POST">

<section class="step active">
<h2>Identification du projet</h2>
<label>Nom du projet<small>Nom public ou interne</small><input name="project_name" required></label>
<label>Type de projet<select name="project_type"><option>Site web</option><option>Application web</option><option>Application mobile</option></select></label>
<label>Description<textarea name="project_desc"></textarea></label>
</section>

<section class="step">
<h2>Objectifs</h2>
<label>Objectif principal<select name="goal"><option>Générer des ventes</option><option>Présenter mon activité</option></select></label>
<label>Succès<textarea name="success"></textarea></label>
</section>

<section class="step">
<h2>Fonctionnalités</h2>
<label><input type="checkbox" name="features" value="auth"> Authentification</label>
<label><input type="checkbox" name="features" value="payment"> Paiement</label>
<label>Autres<textarea name="features_custom"></textarea></label>
</section>

<section class="step">
<h2>Récapitulatif</h2>
<div id="previewContent"></div>
<label><input type="checkbox" required> J’accepte l’utilisation de mes informations</label>
<button type="submit">Envoyer</button>
</section>

<div class="nav-buttons">
<button type="button" id="prevBtn">←</button>
<button type="button" id="nextBtn">→</button>
</div>

</form>
</main>

<script src="main.js"></script>
</body>
</html>
